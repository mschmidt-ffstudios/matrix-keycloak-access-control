<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="752px" preserveAspectRatio="none" style="width:772px;height:752px;background:#FFFFFF;" version="1.1" viewBox="0 0 772 752" width="772px" zoomAndPan="magnify"><title>Matrix Login Entitlement &#8212; Example Flow</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="299.9746" x="234.9072" y="33.5352">Matrix Login Entitlement &#8212; Example Flow</text><ellipse cx="268.2236" cy="57.4883" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F8FAFC" height="34.1328" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="349.8594" x="93.2939" y="87.4883"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="329.8594" x="103.2939" y="109.0898">Browser or Matrix client starts MAS upstream OIDC login</text><rect fill="#F8FAFC" height="34.1328" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="170.709" x="182.8691" y="141.6211"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="150.709" x="192.8691" y="163.2227">MAS redirects to Keycloak</text><path d="M454.2969,185.7539 L454.2969,286.2725 L434.2969,290.2725 L454.2969,294.2725 L454.2969,394.791 A0,0 0 0 0 454.2969,394.791 L760.7891,394.791 A0,0 0 0 0 760.7891,394.791 L760.7891,195.7539 L750.7891,185.7539 L454.2969,185.7539 A0,0 0 0 0 454.2969,185.7539" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M750.7891,185.7539 L750.7891,195.7539 L760.7891,195.7539 L750.7891,185.7539" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.9502" x="481.5679" y="203.3223">The flow requires the existing Browser</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.3081" x="473.3889" y="218.6328">Methods subflow, preserving cookie, IdP,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258.8701" x="473.6079" y="233.9434">password and MFA behavior. It then runs</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258.4131" x="473.8364" y="249.2539">a direct conditional missing-role branch.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="279.8237" x="463.1311" y="264.5645">The v2 flow has no empty required wrapper.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="600.9863" y="279.875">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="274.606" x="465.74" y="295.1855">Keycloak account can remain enabled when</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.7588" x="473.1636" y="310.4961">the role is absent. Entitlement is checked</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="282.9849" x="461.5505" y="325.8066">for Matrix authentication; it need not disable</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.1597" x="500.9631" y="341.1172">unrelated Keycloak applications.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="600.9863" y="356.4277">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="285.4922" x="460.2969" y="371.7383">Verify flow binding, role mapping, and denial</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.3418" x="509.8721" y="387.0488">behavior in each deployment.</text><rect fill="#F8FAFC" height="34.1328" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="332.1465" x="102.1504" y="273.2061"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="312.1465" x="112.1504" y="294.8076">Run the MAS client's dedicated Keycloak Browser flow</text><rect fill="#F8FAFC" height="34.1328" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="511.2559" x="12.5957" y="414.791"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="491.2559" x="22.5957" y="436.3926">Complete existing browser methods (SSO cookie, IdP, password, MFA as configured)</text><polygon fill="#FFF7D6" points="155.3125,468.9238,381.1348,468.9238,393.1348,480.9238,381.1348,492.9238,155.3125,492.9238,143.3125,480.9238,155.3125,468.9238" style="stroke:#A16207;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="225.8223" x="155.3125" y="485.0811">Effective matrix-access realm role absent?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.4829" x="125.8296" y="478.6035">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.5835" x="393.1348" y="478.6035">no</text><rect fill="#F8FAFC" height="34.1328" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="244.625" x="11" y="502.9238"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="224.625" x="21" y="524.5254">Conditional missing-role subflow runs</text><rect fill="#F8FAFC" height="34.1328" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="216.5996" x="25.0127" y="557.0566"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="196.5996" x="35.0127" y="578.6582">Deny Access authenticator rejects</text><rect fill="#F8FAFC" height="34.1328" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="175.3613" x="45.6318" y="611.1895"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="155.3613" x="55.6318" y="632.791">No OIDC success response</text><ellipse cx="133.3125" cy="676.3223" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="133.3125" cy="676.3223" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><rect fill="#F8FAFC" height="34.1328" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="199.5488" x="303.3604" y="502.9238"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="179.5488" x="313.3604" y="524.5254">Conditional subflow is skipped</text><rect fill="#F8FAFC" height="34.1328" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="207.7402" x="299.2646" y="557.0566"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="187.7402" x="309.2646" y="578.6582">Continue OIDC response to MAS</text><rect fill="#F8FAFC" height="34.1328" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="237.0254" x="284.6221" y="611.1895"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="217.0254" x="294.6221" y="632.791">MAS completes Matrix authentication</text><rect fill="#F8FAFC" height="34.1328" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="137.9316" x="334.1689" y="665.3223"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="117.9316" x="344.1689" y="686.9238">Issue Matrix session</text><ellipse cx="403.1348" cy="730.4551" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="403.1348" cy="730.4551" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="268.2236" x2="268.2236" y1="67.4883" y2="87.4883"/><polygon fill="#181818" points="264.2236,77.4883,268.2236,87.4883,272.2236,77.4883,268.2236,81.4883" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="268.2236" x2="268.2236" y1="121.6211" y2="141.6211"/><polygon fill="#181818" points="264.2236,131.6211,268.2236,141.6211,272.2236,131.6211,268.2236,135.6211" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="268.2236" x2="268.2236" y1="175.7539" y2="273.2061"/><polygon fill="#181818" points="264.2236,263.2061,268.2236,273.2061,272.2236,263.2061,268.2236,267.2061" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="268.2236" x2="268.2236" y1="307.3389" y2="414.791"/><polygon fill="#181818" points="264.2236,404.791,268.2236,414.791,272.2236,404.791,268.2236,408.791" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="133.3125" x2="133.3125" y1="537.0566" y2="557.0566"/><polygon fill="#181818" points="129.3125,547.0566,133.3125,557.0566,137.3125,547.0566,133.3125,551.0566" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="133.3125" x2="133.3125" y1="591.1895" y2="611.1895"/><polygon fill="#181818" points="129.3125,601.1895,133.3125,611.1895,137.3125,601.1895,133.3125,605.1895" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="133.3125" x2="133.3125" y1="645.3223" y2="665.3223"/><polygon fill="#181818" points="129.3125,655.3223,133.3125,665.3223,137.3125,655.3223,133.3125,659.3223" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="403.1348" x2="403.1348" y1="537.0566" y2="557.0566"/><polygon fill="#181818" points="399.1348,547.0566,403.1348,557.0566,407.1348,547.0566,403.1348,551.0566" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="403.1348" x2="403.1348" y1="591.1895" y2="611.1895"/><polygon fill="#181818" points="399.1348,601.1895,403.1348,611.1895,407.1348,601.1895,403.1348,605.1895" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="403.1348" x2="403.1348" y1="645.3223" y2="665.3223"/><polygon fill="#181818" points="399.1348,655.3223,403.1348,665.3223,407.1348,655.3223,403.1348,659.3223" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="403.1348" x2="403.1348" y1="699.4551" y2="719.4551"/><polygon fill="#181818" points="399.1348,709.4551,403.1348,719.4551,407.1348,709.4551,403.1348,713.4551" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="143.3125" x2="133.3125" y1="480.9238" y2="480.9238"/><line style="stroke:#181818;stroke-width:1;" x1="133.3125" x2="133.3125" y1="480.9238" y2="502.9238"/><polygon fill="#181818" points="129.3125,492.9238,133.3125,502.9238,137.3125,492.9238,133.3125,496.9238" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="393.1348" x2="403.1348" y1="480.9238" y2="480.9238"/><line style="stroke:#181818;stroke-width:1;" x1="403.1348" x2="403.1348" y1="480.9238" y2="502.9238"/><polygon fill="#181818" points="399.1348,492.9238,403.1348,502.9238,407.1348,492.9238,403.1348,496.9238" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="268.2236" x2="268.2236" y1="448.9238" y2="468.9238"/><polygon fill="#181818" points="264.2236,458.9238,268.2236,468.9238,272.2236,458.9238,268.2236,462.9238" style="stroke:#181818;stroke-width:1;"/><!--SRC=[TLJBRjj03BphAmZqK0TmZ2PfaY8-58uT0KRhfcY2tcaj9MszsbMNApyG5EX7z0lx9ULAikiWoCM0bqDoE4Cgw6085XYyti9dLsWBTpR4nufiWB-__y3T5gjQGAbncuHNsjReiG8kKRcDjWNaQ9YE8efoR4nuf6sO65tOjb8cF-IFK9W5lTPX1qy9m2rcgyAxnggfCyx3c_H3EacdCUAy8j-_NboyFxkybDUPnifPzJ8jJQzdLqU0u-p9sTNvk-laLv9mG1-IcrllDamU9DWha1aToRPnXiNa0PgQWoVXUp-VJS54XSR9JOnuKjfJ9hZWu1FjCkDm9R5lZOLGKflTrNlBeedI6GPI1oJik-UYwpYnBX1