<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="880px" preserveAspectRatio="none" style="width:1142px;height:880px;background:#FFFFFF;" version="1.1" viewBox="0 0 1142 880" width="1142px" zoomAndPan="magnify"><title>Room Access and Monitored 1:1 Chat Policy</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="315.8545" x="411.8335" y="33.5352">Room Access and Monitored 1:1 Chat Policy</text><ellipse cx="567.6499" cy="57.4883" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F8FAFC" height="48.2656" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="381.3828" x="376.9585" y="87.4883"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="361.3828" x="386.9585" y="109.0898">Policy Sync reads Keycloak users, effective Matrix entitlement,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="309.3164" x="412.9917" y="123.2227">clearance, room roles and direct group memberships</text><rect fill="#F8FAFC" height="34.1328" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="384.3242" x="375.4878" y="155.7539"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="364.3242" x="385.4878" y="177.3555">Require current Matrix entitlement and a recognized clearance</text><polygon fill="#FFF7D6" points="493.3005,209.8867,641.9993,209.8867,653.9993,221.8867,641.9993,233.8867,493.3005,233.8867,481.3005,221.8867,493.3005,209.8867" style="stroke:#A16207;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="148.6987" x="493.3005" y="226.0439">Configured managed room?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.4829" x="463.8176" y="219.5664">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="56.6113" x="653.9993" y="219.5664">direct chat</text><rect fill="#F8FAFC" height="34.1328" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="269.4395" x="52.6572" y="243.8867"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="249.4395" x="62.6572" y="265.4883">Require clearance rank &gt;= room minimum</text><rect fill="#F8FAFC" height="34.1328" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="241.8008" x="66.4766" y="298.0195"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="221.8008" x="76.4766" y="319.6211">Require exactly one explicit room role</text><rect fill="#F8FAFC" height="34.1328" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="352.7539" x="11" y="352.1523"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="332.7539" x="21" y="373.7539">Join OrgBot at PL 0 and check its authenticated readiness</text><path d="M332.6514,406.2852 L332.6514,437.9063 L312.6514,441.9063 L332.6514,445.9063 L332.6514,477.5273 A0,0 0 0 0 332.6514,477.5273 L744.3242,477.5273 A0,0 0 0 0 744.3242,477.5273 L744.3242,416.2852 L734.3242,406.2852 L332.6514,406.2852 A0,0 0 0 0 332.6514,406.2852" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M734.3242,406.2852 L734.3242,416.2852 L744.3242,416.2852 L734.3242,406.2852" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="380.0024" x="343.9866" y="423.8535">Clearance: basis &lt; intern &lt; vertraulich &lt; streng_vertraulich.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="295.5151" x="386.2302" y="439.1641">Role power: reader 0, writer 10, moderator 50.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="390.6729" x="338.6514" y="454.4746">Rooms are invite-only, joined-history and Megolm encrypted.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="292.1001" x="387.9377" y="469.7852">Clearance labels do not change E2EE strength.</text><rect fill="#F8FAFC" height="34.1328" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="250.5488" x="62.1025" y="424.8398"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="230.5488" x="72.1025" y="446.4414">Set membership and Matrix power level</text><rect fill="#F8FAFC" height="34.1328" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="312.4063" x="791.7197" y="243.8867"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="292.4063" x="801.7197" y="265.4883">Require both users share the same exact group ID</text><rect fill="#F8FAFC" height="34.1328" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="250.9238" x="822.4609" y="298.0195"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="230.9238" x="832.4609" y="319.6211">Require group name prefix `1to1chat.`</text><rect fill="#F8FAFC" height="34.1328" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="367.1973" x="764.3242" y="352.1523"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="347.1973" x="774.3242" y="373.7539">Create private non-federated room with signed pair marker</text><rect fill="#F8FAFC" height="34.1328" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="338.6387" x="778.6035" y="406.2852"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="318.6387" x="788.6035" y="427.8867">Invite OrgBot and peer; require Megolm and joined Bot</text><polygon fill="#FFF7D6" points="567.6499,483.5273,579.6499,495.5273,567.6499,507.5273,555.6499,495.5273,567.6499,483.5273" style="stroke:#A16207;stroke-width:0.5;"/><rect fill="#F8FAFC" height="34.1328" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="386.9609" x="374.1694" y="527.5273"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="366.9609" x="384.1694" y="549.1289">Synapse rechecks current policy and room state on each action</text><polygon fill="#FFF7D6" points="426.7097,581.6602,708.5901,581.6602,720.5901,593.6602,708.5901,605.6602,426.7097,605.6602,414.7097,593.6602,426.7097,581.6602" style="stroke:#A16207;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="281.8804" x="426.7097" y="597.8174">Current authorization and required room state valid?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.4829" x="397.2268" y="591.3398">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.5835" x="720.5901" y="591.3398">no</text><rect fill="#F8FAFC" height="34.1328" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="363.4121" x="223.0037" y="615.6602"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="343.4121" x="233.0037" y="637.2617">Allow only the actions granted by room power / pair policy</text><rect fill="#F8FAFC" height="34.1328" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="179.7441" x="640.718" y="615.6602"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="159.7441" x="650.718" y="637.2617">Deny new access or actions</text><polygon fill="#FFF7D6" points="567.6499,655.793,579.6499,667.793,567.6499,679.793,555.6499,667.793,567.6499,655.793" style="stroke:#A16207;stroke-width:0.5;"/><path d="M598.6499,689.793 L598.6499,775.001 L578.6499,779.001 L598.6499,783.001 L598.6499,868.209 A0,0 0 0 0 598.6499,868.209 L1027.2583,868.209 A0,0 0 0 0 1027.2583,868.209 L1027.2583,699.793 L1017.2583,689.793 L598.6499,689.793 A0,0 0 0 0 598.6499,689.793" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1017.2583,689.793 L1017.2583,699.793 L1027.2583,699.793 L1017.2583,689.793" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="398.7471" x="609.0806" y="707.3613">Ordinary organization/department groups grant no 1:1 access.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="378.6504" x="619.1289" y="722.6719">Nested-group inheritance and the `m.direct` client hint are</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="355.5132" x="630.6975" y="737.9824">not authorization. Missing or expired policy fails closed;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="388.686" x="614.1111" y="753.293">revocation removes known unauthorized room memberships.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="407.6084" x="604.6499" y="768.6035">Bot readiness/membership does not prove every decryption key.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="806.3975" y="783.9141">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="370.2778" x="623.3152" y="799.2246">The MAS-specific Keycloak flow requires `matrix-access`.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="346.855" x="635.0266" y="814.5352">Current policy snapshots carry that grant for room and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="134.3354" x="741.2864" y="829.8457">export authorization.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="366.0313" x="625.4385" y="845.1563">Verify the configured mappings and enforcement for each</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="78.5649" x="769.1716" y="860.4668">deployment.</text><ellipse cx="567.6499" cy="779.001" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="567.6499" cy="779.001" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="567.6499" x2="567.6499" y1="67.4883" y2="87.4883"/><polygon fill="#181818" points="563.6499,77.4883,567.6499,87.4883,571.6499,77.4883,567.6499,81.4883" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="567.6499" x2="567.6499" y1="135.7539" y2="155.7539"/><polygon fill="#181818" points="563.6499,145.7539,567.6499,155.7539,571.6499,145.7539,567.6499,149.7539" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="187.377" x2="187.377" y1="278.0195" y2="298.0195"/><polygon fill="#181818" points="183.377,288.0195,187.377,298.0195,191.377,288.0195,187.377,292.0195" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="187.377" x2="187.377" y1="332.1523" y2="352.1523"/><polygon fill="#181818" points="183.377,342.1523,187.377,352.1523,191.377,342.1523,187.377,346.1523" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="187.377" x2="187.377" y1="386.2852" y2="424.8398"/><polygon fill="#181818" points="183.377,414.8398,187.377,424.8398,191.377,414.8398,187.377,418.8398" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="947.9