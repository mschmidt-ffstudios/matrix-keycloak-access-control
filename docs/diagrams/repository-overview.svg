nt-size="14" lengthAdjust="spacing" textLength="123.4297" x="820" y="149.0217">identity endpoints</text></g><!--entity Synapse--><g class="entity" data-entity="Synapse" data-source-line="15" data-uid="ent0006" id="entity_Synapse"><rect fill="#F1F1F1" height="52.9766" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="217.3467" x="773.04" y="185.9983"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="55.0225" x="854.2021" y="209.5334">Synapse</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="197.3467" x="783.04" y="226.0217">Matrix API; admin API private</text></g><!--entity Export--><g class="entity" data-entity="Export" data-source-line="16" data-uid="ent0007" id="entity_Export"><rect fill="#F1F1F1" height="52.9766" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="216.1504" x="773.64" y="262.9983"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="96.3115" x="833.5594" y="286.5334">Export Service</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="196.1504" x="783.64" y="303.0217">authenticated scoped ZIP API</text></g><!--entity Provisioner--><g class="entity" data-entity="Provisioner" data-source-line="20" data-uid="ent0009" id="entity_Provisioner"><rect fill="#F1F1F1" height="52.9766" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="186.6807" x="1271.15" y="78.9983"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="75.3594" x="1326.8106" y="102.5334">Provisioner</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="166.6807" x="1281.15" y="119.0217">identity + session issuer</text></g><!--entity PolicySync--><g class="entity" data-entity="PolicySync" data-source-line="21" data-uid="ent0010" id="entity_PolicySync"><rect fill="#F1F1F1" height="52.9766" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="222.2002" x="1253.39" y="155.9983"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="74.0605" x="1327.4598" y="179.5334">Policy Sync</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="202.2002" x="1263.39" y="196.0217">reads grants; manages rooms</text></g><!--entity OrgBot--><g class="entity" data-entity="OrgBot" data-source-line="22" data-uid="ent0011" id="entity_OrgBot"><rect fill="#F1F1F1" height="52.9766" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="125.9502" x="1301.51" y="232.9983"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="47.2227" x="1340.8738" y="256.5334">OrgBot</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="105.9502" x="1311.51" y="273.0217">PL 0 E2EE client</text></g><!--entity Users--><g class="entity" data-entity="Users" data-source-line="10" data-uid="ent0002" id="entity_Users"><ellipse cx="122.7544" cy="174.4983" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M122.7544,182.4983 L122.7544,209.4983 M109.7544,190.4983 L135.7544,190.4983 M122.7544,209.4983 L109.7544,224.4983 M122.7544,209.4983 L135.7544,224.4983" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="37.502" x="104.0034" y="239.5334">Users</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="233.5088" x="6" y="256.0217">web / native client / export admin</text></g><!--entity Edge--><g class="entity" data-entity="Edge" data-source-line="11" data-uid="ent0003" id="entity_Edge"><rect fill="#F1F1F1" height="52.9766" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="298.5303" x="270.51" y="185.9983"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="137.5322" x="351.009" y="209.5334">Nginx reverse proxy</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="278.5303" x="280.51" y="226.0217">Element Web + public HTTPS/WSS routes</text></g><g class="entity" data-entity="GMN21" data-source-line="36" data-uid="ent0022" id="entity_GMN21"><path d="M1551.15,77.5183 L1551.15,101.4883 L1458.15,105.4883 L1551.15,109.4883 L1551.15,133.4499 A0,0 0 0 0 1551.15,133.4499 L1843.9757,133.4499 A0,0 0 0 0 1843.9757,133.4499 L1843.9757,87.5183 L1833.9757,77.5183 L1551.15,77.5183 A0,0 0 0 0 1551.15,77.5183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1833.9757,77.5183 L1833.9757,87.5183 L1843.9757,87.5183 L1833.9757,77.5183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258.6797" x="1563.723" y="95.0866">Admin-token volume: Provisioner writes;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.8257" x="1557.15" y="110.3972">Policy Sync reads read-only. OrgBot has no</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="139.5723" x="1623.2767" y="125.7077">mount of this volume.</text></g><g class="entity" data-entity="GMN24" data-source-line="42" data-uid="ent0025" id="entity_GMN24"><path d="M1523.59,216.2083 L1523.59,302.761 L1871.5451,302.761 L1871.5451,226.2083 L1861.5451,216.2083 L1523.59,216.2083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1861.5451,216.2083 L1861.5451,226.2083 L1871.5451,226.2083 L1861.5451,216.2083" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="279.5444" x="1553.2953" y="233.7766">Separate session volume: Provisioner writes;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="314.3804" x="1535.8774" y="249.0872">OrgBot mounts read-only. Crypto store is private.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="306.4204" x="1539.8573" y="264.3977">Synapse relays E2EE events and keys; it does not</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="296.1689" x="1544.9831" y="279.7083">decrypt room content. Export receives only the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="326.9551" x="1529.59" y="295.0188">Bot's observed/decrypted ZIP, which may be partial.</text></g><g class="entity" data-entity="GMN27" data-source-line="50" data-uid="ent0028" id="entity_GMN27"><path d="M1536.33,327.1783 L1536.33,367.7994 L1858.7992,367.7994 L1858.7992,337.1783 L1848.7992,327.1783 L1536.33,327.1783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1848.7992,327.1783 L1848.7992,337.1783 L1858.7992,337.1783 L1848.7992,327.1783" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="301.4692" x="1542.33" y="344.7466">Optional MatrixRTC authorization and signaling</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="280.4839" x="1552.8227" y="360.0572">are shown separately in matrixrtc-call.puml.</text></g><!--link Users to Edge--><g class="link" data-entity-1="Users" data-entity-2="Edge" data-source-line="25" data-uid="lnk12" id="link_Users_Edge"><path d="M239.93,212.4883 C249.93,212.4883 254.13,212.4883 264.33,212.4883" fill="none" id="Users-to-Edge" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="270.33,212.4883,261.33,208.4883,265.33,212.4883,261.33,216.4883,270.33,212.4883" style="stroke:#181