<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="915px" preserveAspectRatio="none" style="width:1166px;height:915px;background:#FFFFFF;" version="1.1" viewBox="0 0 1166 915" width="1166px" zoomAndPan="magnify"><title>E2EE OrgBot and Protected Export</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="245.4854" x="458.9907" y="33.5352">E2EE OrgBot and Protected Export</text><ellipse cx="614.0127" cy="57.4883" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F8FAFC" height="34.1328" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="256.4902" x="485.7676" y="87.4883"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="236.4902" x="495.7676" y="109.0898">Export administrator selects room scope</text><rect fill="#F8FAFC" height="34.1328" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="361.1094" x="433.458" y="141.6211"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="341.1094" x="443.458" y="163.2227">Export page signs in through Keycloak using OIDC + PKCE</text><rect fill="#F8FAFC" height="34.1328" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="354.752" x="436.6367" y="195.7539"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="334.752" x="446.6367" y="217.3555">Export Service verifies signed claims using Keycloak JWKS</text><rect fill="#F8FAFC" height="34.1328" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="314.293" x="456.8662" y="249.8867"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="294.293" x="466.8662" y="271.4883">Reload current room map and authorization policy</text><polygon fill="#FFF7D6" points="420.1941,304.0195,807.8313,304.0195,819.8313,316.0195,807.8313,328.0195,420.1941,328.0195,408.1941,316.0195,420.1941,304.0195" style="stroke:#A16207;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="387.6372" x="420.1941" y="320.1768">matrix-access, org-export-admin and current requested scope allowed?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.4829" x="390.7112" y="313.6992">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.5835" x="819.8313" y="313.6992">no</text><rect fill="#F8FAFC" height="34.1328" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="346.5898" x="42.5527" y="338.0195"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="326.5898" x="52.5527" y="359.6211">Send exact room IDs to OrgBot over its private endpoint</text><path d="M434.1943,382.1523 L434.1943,459.7051 L414.1943,463.7051 L434.1943,467.7051 L434.1943,545.2578 A0,0 0 0 0 434.1943,545.2578 L848.8887,545.2578 A0,0 0 0 0 848.8887,545.2578 L848.8887,392.1523 L838.8887,382.1523 L434.1943,382.1523 A0,0 0 0 0 434.1943,382.1523" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M838.8887,382.1523 L838.8887,392.1523 L848.8887,392.1523 L838.8887,382.1523" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="352.333" x="460.875" y="399.7207">OrgBot is joined to approved encrypted rooms as a PL 0</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="362.3369" x="455.873" y="415.0313">participant and uses its own persistent E2EE device store.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="354.3896" x="459.8467" y="430.3418">Its session-only volume is separate from the Policy Sync</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="393.6943" x="440.1943" y="445.6523">administrator-token volume. OrgBot has no room-admin role.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="634.9849" y="460.9629">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="370.7285" x="451.6772" y="476.2734">Policy Sync's private administrator creates managed rooms</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="371.4331" x="451.325" y="491.584">and controls membership/security state, not E2EE content.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="374.9941" x="449.5444" y="506.8945">In v12 the creator has immutable power and is absent from</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="361.8672" x="456.1079" y="522.2051">the power-level `users` map. For v11 with a power-level</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="377.3555" x="448.3638" y="537.5156">event, creator power is `users[creator]` or `users_default`.</text><rect fill="#F8FAFC" height="34.1328" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="396.6934" x="17.501" y="446.6387"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="376.6934" x="27.501" y="468.2402">OrgBot uses content from its continuous non-admin Matrix sync</text><rect fill="#F8FAFC" height="34.1328" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="333.002" x="49.3467" y="565.2578"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="313.002" x="59.3467" y="586.8594">Decrypt only content available to OrgBot's own device</text><rect fill="#F8FAFC" height="34.1328" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="367.3262" x="32.1846" y="619.3906"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="347.3262" x="42.1846" y="640.9922">Package observed events and available attachments in a ZIP</text><rect fill="#F8FAFC" height="34.1328" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="409.6953" x="11" y="673.5234"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="389.6953" x="21" y="695.125">Recheck current actor, entitlement and exact scope before delivery</text><rect fill="#F8FAFC" height="34.1328" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="328.9004" x="51.3975" y="727.6563"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="308.9004" x="61.3975" y="749.2578">Return archive, completeness status and audit digest</text><rect fill="#F8FAFC" height="34.1328" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="286.5781" x="868.8887" y="338.0195"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="266.5781" x="878.8887" y="359.6211">Reject before requesting content from OrgBot</text><polygon fill="#FFF7D6" points="614.0127,767.7891,626.0127,779.7891,614.0127,791.7891,602.0127,779.7891,614.0127,767.7891" style="stroke:#A16207;stroke-width:0.5;"/><path d="M645.0127,801.7891 L645.0127,848.7207 L625.0127,852.7207 L645.0127,856.7207 L645.0127,903.6523 A0,0 0 0 0 645.0127,903.6523 L1067.6797,903.6523 A0,0 0 0 0 1067.6797,903.6523 L1067.6797,811.7891 L1057.6797,801.7891 L645.0127,801.7891 A0,0 0 0 0 645.0127,801.7891" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1057.6797,801.7891 L1057.6797,811.7891 L1067.6797,811.7891 L1057.6797,801.7891" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="401.667" x="651.0127" y="819.3574">Archives describe observed/decrypted content. Missing history,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="391.4663" x="656.113" y="834.668">keys or media remain visible as gaps; current status is partial.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="849.7896" y="849.9785">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="381.5195" x="661.0864" y="865.2891">Verify encrypted messages and attachments with a synthetic</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="385.3979" x="659.1472" y="880.5996">end-to-end fixture. The bot does not backfill history, and an</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="300.3584" x="701.667" y="895.9102">archive can be partial even when its ZIP is valid.</text><ellipse cx="614.0127" cy="852.7207" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="614.0127" cy="852.7207" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="614.0127" x2="614.0127" y1="67.4883" y2="87.4883"/><polygon fill="#181818" points="610.0127,77.4883,614.0127,87.4883,618.0127,77.4883,614.0127,81.4883" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="614.0127" x2="614.0127" y1="121.6211" y2="141.6211"/><polygon fill="#181818" points="610.0127,131.6211,614.0127,141.6211,618.0127,131.6211,614.0127,135.6211" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="614.0127" x2="614.0127" y1="175.7539" y2="195.7539"/><polygon fill="#181818" points="610.0127,185.7539,614.0127,195.7539,618.0127,185.7539,614.0127,189.7539" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="614.0127" x2="614.0127" y1="229.8867" y2="249.8867"/><polygon fill="#181818" points="610.0127,239.8867,614.0127,249.8867,618.0127,239.8867,614.0127,243.8867" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="215.8477" x2="215.8477" y1="372.1523" y2="446.6387"/><polygon fill="#181818" points="211.8477,436.6387,215.8477,446.6387,219.8477,436.6387,215.8477,440.6387" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="215.8477" x2="215.8477" y1="480.7715" y2="565.2578"/><polygon fill="#181818" points="211.8477,555.2578,215.8477,565.2578,219.8477,555.2578,215.8477,559.2578" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="215.8477" x2="215.8477" y1="599.3906" y2="619.3906"/><polygon fill="#181818" points="211.8477,609.3906,215.8477,619.3906,219.8477,609.3906,215.8477,613.3906" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="215.8477" x2="215.8477" y1="653.5234" y2="673.5234"/><polygon fill="#181818" points="211.8477,663.5234,215.8477,673.5234,219.8477,663.5234,215.8477,667.5234" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="215.8477" x2="215.8477" y1="707.6563" y2="727.6563"/><polygon fill="#181818" points="211.8477,717.6563,215.8477,727.6563,219.8477,717.6563,215.8477,721.6563" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="408.1941" x2="215.8477" y1="316.0195" y2="316.0195"/><line style="stroke:#181818;stroke-width:1;" x1="215.8477" x2="215.8477" y1="316.0195" y2="338.0195"/><polygon fill="#181818" points="211.8477,328.0195,215.8477,338.0195,219.8477,328.0195,215.8477,332.0195" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="819.8313" x2="1012.1777" y1="316.0195" y2="316.0195"/><line style="stroke:#181818;stroke-width:1;" x1="1012.1777" x2="1012.1777" y1="316.0195" y2="338.0195"/><polygon fill="#181818" points="1008.1777,328.0195,1012.1777,338.0195,1016.1777,328.0195,1012.1777,332.0195" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="215.8477" x2="215.8477" y1="761.7891" y2="779.7891"/><line style="stroke:#181818;stroke-width:1;" x1="215.8477" x2="602.0127" y1="779.7891" y2="779.7891"/><polygon fill="#181818" points="592.0127,775.7891,602.0127,779.7891,592.0127,783.7891,596.0127,779.7891" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="1012.1777" x2="1012.1777" y1="372.1523" y2="779.7891"/><line style="stroke:#181818;stroke-width:1;" x1="1012.1777" x2="626.0127" y1="779.7891" y2="779.7891"/><polygon fill="#181818" points="636.0127,775.7891,626.0127,779.7891,636.0127,783.7891,632.0127,779.7891" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="614.0127" x2="614.0127" y1="284.0195" y2="304.0195"/><polygon fill="#181818" points="610.0127,294.0195,614.0127,304.0195,618.0127,294.0195,614.0127,298.0195" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="614.0127" x2="614.0127" y1="791.7891" y2="841.7207"/><polygon fill="#181818" points="610.0127,831.7207,614.0127,841.7207,618.0127,831.7207,614.0127,835.7207" style="stroke:#181818;stroke-width:1;"/><!--SRC=[PLJHRXit47pNLopGXzYev4HEanJHG-5O4k0wGOGuQ84MHKtnLhgDUEILv4cw5ltt3dcdium2Xc7pkCkPsPcD4WtJudgneCz- -y55KhQWbNUHTUI25iVQ-JWAEx6ryggYKAh27SHkQQDCuBCl1MzKO-9NFiOR8rjRiOsayOlzsIsbe-mbjlJFYEY3qhkjTuqjRfrndhvR_hYyMTwcByuNxFlJrwz_cBvvWzEvgChPulzbo-Mx-Tkp2-VLDzEtrw_UZVuTZK9KuFA-uqIggCHAY5v5N0jim3YGTmuajQjvDjoirPOfW58WiHHBFBqjwPvRRPpQKHEI79_lvhVqFQtkRnTFbG_izwAPzknb8nno5yYgZP8gz9L3evz_lNz0xHV6VxZJU9yap8WgLUV9g2QMpilVAegpL3iZkfsDP4CNbOfUZXEbDOSm9kUt4yuW9fbehXvQybyDXpJVp9IKCUx0nK-N8CUMBbeEbr3p_GEZY8-OMOVYRXuekfDJ75YHGBFQorv5