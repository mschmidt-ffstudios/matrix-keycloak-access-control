<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="495px" preserveAspectRatio="none" style="width:757px;height:495px;background:#FEFEFD;" version="1.1" viewBox="0 0 757 495" width="757px" zoomAndPan="magnify"><title>From Keycloak grants to Matrix actions</title><defs/><g><rect fill="#FEFEFD" height="495" style="stroke:none;stroke-width:1;" width="757" x="0" y="0"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="283.3223" x="229.9988" y="23.5352">From Keycloak grants to Matrix actions</text><!--entity Keycloak--><g class="entity" data-entity="Keycloak" data-source-line="16" data-uid="ent0002" id="entity_Keycloak"><rect fill="#E0ECFF" height="72.998" rx="6" ry="6" style="stroke:#334155;stroke-width:0.5;" width="318.7256" x="113.29" y="44.4883"/><text fill="#0F172A" font-family="sans-serif" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="68.9355" x="238.185" y="68.9902">Keycloak</text><text fill="#0F172A" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="298.7256" x="123.29" y="86.6563">Realm roles &#183; matrix-synapse client roles</text><text fill="#0F172A" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="279.5874" x="132.8591" y="104.3223">security_clearance &#183; 1to1chat.* groups</text></g><!--entity MAS--><g class="entity" data-entity="MAS" data-source-line="17" data-uid="ent0003" id="entity_MAS"><rect fill="#F8FAFC" height="55.332" rx="6" ry="6" style="stroke:#334155;stroke-width:0.5;" width="247.2998" x="7" y="177.3183"/><text fill="#0F172A" font-family="sans-serif" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="227.2998" x="17" y="201.8202">Matrix Authentication Service</text><text fill="#0F172A" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="183.0835" x="39.1082" y="219.4862">Issues the Matrix session</text></g><!--entity Sync--><g class="entity" data-entity="Sync" data-source-line="18" data-uid="ent0004" id="entity_Sync"><rect fill="#E0F2FE" height="72.998" rx="6" ry="6" style="stroke:#334155;stroke-width:0.5;" width="269.397" x="279.95" y="168.4883"/><text fill="#0F172A" font-family="sans-serif" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="85.3564" x="371.9703" y="192.9902">Policy Sync</text><text fill="#0F172A" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="249.397" x="289.95" y="210.6563">Matches grants to the room policy</text><text fill="#0F172A" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="238.4839" x="295.4065" y="228.3223">Publishes a short-lived snapshot</text></g><!--entity Synapse--><g class="entity" data-entity="Synapse" data-source-line="19" data-uid="ent0005" id="entity_Synapse"><rect fill="#DDF4EA" height="72.998" rx="6" ry="6" style="stroke:#334155;stroke-width:0.5;" width="261.7139" x="135.79" y="292.4783"/><text fill="#0F172A" font-family="sans-serif" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="215.3613" x="158.9663" y="316.9802">Synapse with policy module</text><text fill="#0F172A" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="241.7139" x="145.79" y="334.6463">Enforces room and 1:1 chat rules</text><text fill="#0F172A" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="193.0005" x="170.1467" y="352.3123">Checks current room state</text></g><!--entity Export--><g class="entity" data-entity="Export" data-source-line="20" data-uid="ent0006" id="entity_Export"><rect fill="#F8FAFC" height="72.998" rx="6" ry="6" style="stroke:#334155;stroke-width:0.5;" width="325.3247" x="423.99" y="292.4783"/><text fill="#0F172A" font-family="sans-serif" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="109.9585" x="531.6731" y="316.9802">Export Service</text><text fill="#0F172A" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="305.3247" x="433.99" y="334.6463">Checks matrix-access, org-export-admin</text><text fill="#0F172A" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="174.7266" x="499.2891" y="352.3123">and current room scope</text></g><!--entity Bot--><g class="entity" data-entity="Bot" data-source-line="21" data-uid="ent0007" id="entity_Bot"><rect fill="#FFF1D8" height="72.998" rx="6" ry="6" style="stroke:#334155;stroke-width:0.5;" width="327.3022" x="262" y="416.4783"/><text fill="#0F172A" font-family="sans-serif" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="54.1699" x="398.5662" y="440.9802">OrgBot</text><text fill="#0F172A" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="240.0952" x="305.6035" y="458.6463">Read-only E2EE room participant</text><text fill="#0F172A" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="307.3022" x="272" y="476.3123">Builds a scoped ZIP from available content</text></g><!--link Keycloak to MAS--><g class="link" data-entity-1="Keycloak" data-entity-2="MAS" data-source-line="23" data-uid="lnk8" id="link_Keycloak_MAS"><path d="M161.1,117.9383 C155.03,122.5183 149.47,127.6783 144.65,133.4883 C134.7,145.4883 131.5537,156.594 130.5137,170.944" fill="none" id="Keycloak-to-MAS" style="stroke:#475569;stroke-width:1;"/><polygon fill="#475569" points="130.08,176.9283,134.7201,168.241,130.4414,171.9414,126.741,167.6627,130.08,176.9283" style="stroke:#475569;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="231.0791" x="145.65" y="148.9902">OIDC after matrix-access check</text></g><!--link Keycloak to Sync--><g class="link" data-entity-1="Keycloak" data-entity-2="Sync" data-source-line="24" data-uid="lnk9" id="link_Keycloak_Sync"><path d="M360.36,117.9083 C367.3,122.5783 373.86,127.7583 379.65,133.4883 C389.37,143.0883 394.3609,150.4844 399.8509,162.5844" fill="none" id="Keycloak-to-Sync" style="stroke:#475569;stroke-width:1;"/><polygon fill="#475569" points="402.33,168.0483,402.254,158.1997,400.2641,163.495,394.9688,161.5051,402.33,168.0483" style="stroke:#475569;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="112.5806" x="394.98" y="148.9902">effective grants</text></g><!--link Sync to Synapse--><g class="link" data-entity-1="Sync" data-entity-2="Synapse" data-source-line="25" data-uid="lnk10" id="link_Sync_Synapse"><path d="M324.69,241.9083 C317.51,246.5783 310.7,251.7583 304.65,257.4783 C294.54,267.0283 289.2073,274.5038 283.1973,286.6138" fill="none" id="Sync-to-Synapse" style="stroke:#475569;stroke-width:1;"/><polygon fill="#475569" points="280.53,291.9883,288.114,285.7047,282.7527,287.5095,280.9479,282.1483,280.53,291.9883" style="stroke:#475569;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="248.2178" x="305.65" y="272.9802">membership, power and snapshot</text></g><!--reverse link MAS to Synapse--><g class="link" data-entity-1="MAS" data-entity-2="Synapse" data-source-line="26" data-uid="lnk12" id="link_MAS_Synapse"><path d="M122.283,238.8531 C120.023,252.9931 121.01,263.9983 129.65,276.4783 C133.7,282.3283 138.5,287.5183 143.85,292.1183" fill="none" id="MAS-backto-Synapse" style="stroke:#475569;stroke-width:1;"/><polygon fill="#475569" points="123.23,232.9283,117.8597,241.1842,122.4409,237.8656,125.7594,242.4468,123.23,232.9283" style="stroke:#475569;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="142.207" x="130.65" y="272.9802">token introspection</text></g><!--link Sync to Export--><g class="link" data-entity-1="Sync" data-entity-2="Export" data-source-line="27" data-uid="lnk13" id="link_Sync_Export"><path d="M536.21,241.7983 C543.56,246.4183 550.46,251.6183 556.6